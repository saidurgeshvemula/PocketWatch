
version: '3.9'

services:

  mysql:
    image: mysql:8.0
    container_name: et_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: expensedb
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: